[package]
name = "app"
version = "0.1.0"
description = "HayDevBrowser — Tauri 2 desktop runtime (browser core)"
authors = ["HayDev Labs"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
haydev-poker-core = { path = "poker-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` = the multi-webview API surface (WebviewBuilder + Window::add_child).
# Required for child tab webviews in one window; this is the standard route for
# Tauri-based browsers ("unstable" = API may change between minors, not runtime).
tauri = { version = "2.11.6", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json", "socks-proxy", "native-tls"] }
url = "2"
psl = "=2.1.238"
# OS CSPRNG for vault password generation (PROMPT 03) — replaces the
# time-seeded xorshift.
getrandom = "0.2"
sha2 = "0.10"
regex = "1"
# HTML allowlist sanitizer for the darkweb preview (parity: the Electron
# preview sanitizer — script/style-free fragment, a[href http(s)] only).
ammonia = "4"
# Attachment vision pipeline: decode → downscale (≤1024 model / 192 thumb)
# → JPEG. Only reached for picked image files, off the main thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
pdf-extract = "=0.12.1"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "0.61"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# unwind (NOT abort): a panicking provider/agent worker thread must kill only
# itself — never the whole browser with 20 open tabs. The panic hook in
# lib.rs still logs every unwind.
panic = "unwind"
strip = true
