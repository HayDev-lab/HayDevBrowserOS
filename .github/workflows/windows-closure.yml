name: Windows closure
on:
  push:
    branches: [main]
    paths: ['electron-app/**', '.github/workflows/**']
  pull_request:
    paths: ['electron-app/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-closure-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: electron-app
    shell: pwsh
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      HAYDEV_EVIDENCE_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
      HAYDEV_DOCUMENT_FIXTURES: ${{ github.workspace }}/artifacts/closure/ci-${{ github.run_id }}-${{ github.run_attempt }}/documents
    steps:
      - name: Deterministic checkout (no EOL conversion — checksum-verified pinned inputs)
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Locked toolchain and source identity
        run: |
          rustup show
          node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN snapshot ci-source
      - name: Application dependencies
        run: npm ci --no-audit --no-fund
      - name: All TypeScript projects
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run typecheck npm run typecheck
      - name: Lint
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run lint npm run lint
      - name: Unit tests
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run unit npm test
      - name: Pinned integration source and dependencies
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run integration-prepare npm run integration:prepare
      - name: Integration types
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run integration-types npm run typecheck:integration
      - name: Integration tests
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run integration-tests npm run test:integration
      - name: Verified bundled runtimes
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run runtimes npm run bundle:runtimes
      - name: Internal pages and renderer
        run: |
          node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run internal-pages npm run build:internal-pages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run renderer npm run build:vite
      - name: Rust tests
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run rust-tests cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Debug executable and synthetic document corpus
        run: |
          node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run debug-build cargo build --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r scripts/e2e/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/e2e/make-documents.py $env:HAYDEV_DOCUMENT_FIXTURES
      - name: Real WebView2 native E2E with isolated synthetic profiles
        # Shared runners are timing-variable: keep the step result visible but do
        # not block the release artifact; the strict perf/native gate runs on the
        # certified local hardware.
        continue-on-error: true
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run native-e2e npm run test:e2e
      - name: Bundled services without system Node or Python
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run runtime-offline node scripts/check-bundled-runtimes.mjs
      - name: Windows release and NSIS installer
        run: node scripts/closure-evidence.mjs $env:HAYDEV_EVIDENCE_RUN run release npm run build:tauri -- --ci -- --locked
      - name: Artifact hashes
        if: always()
        run: |
          $paths = @('src-tauri/target/release/app.exe', 'resources/packaged-runtimes/runtime-manifest.json')
          $paths += @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $hashes = @($paths | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath $_ })
          $hashes | ConvertTo-Json | Set-Content -Encoding utf8 ../artifacts/closure/$env:HAYDEV_EVIDENCE_RUN/artifact-hashes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-closure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/closure/ci-${{ github.run_id }}-${{ github.run_attempt }}/
            electron-app/src-tauri/target/release/bundle/nsis/*.exe
            electron-app/resources/packaged-runtimes/runtime-manifest.json
